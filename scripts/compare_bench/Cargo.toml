[workspace]

[package]
name = "compare-bench"
version = "0.1.0"
edition = "2021"

[dependencies]
aise-core = { path = "../../crates/aise-core" }
sha2 = "0.10"
sha3 = "0.10"
blake2 = "0.10"
blake3 = "1"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
